<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f5bd7" />
<title>Người dùng hệ thống - PlatformManager</title>
<style>
:root{
  /* ===== Đã CHỐT LẠI (2026-08-15) — đồng bộ với dashboard.html/danh-muc-dti.html/
     login.html/styles.scss, xem báo cáo "Kiểm Tra Tương Phản". ===== */
  /* LẦN 3 — fill-first thay border-first, xem artifact "Hướng Màu Sắc" */
  --bg:#eef2f8;--card:#fff;--surface-2:#e1e7f1;--tonal-bg:#dbe7fa;--tonal-ink:#0f4a9e;--text:#152033;--muted:#57647a;--line:#dfe6ef;--border-strong:#7e91b4;
  --brand:#0f5bd7;--brand2:#174ca8;--good:#0e7050;--good-bg:#d9f2e6;--warn:#a8690a;--warn-bg:#ffedc7;--bad:#b83232;--bad-bg:#fbdcdc;
  --shadow:0 4px 16px rgba(23,39,67,.1),0 1px 3px rgba(23,39,67,.06);
  --fs-xs:11px;--fs-sm:12px;--fs-base:13px;--fs-md:14px;--fs-lg:15px;
  --sp-1:4px;--sp-2:6px;--sp-3:8px;--sp-4:10px;--sp-5:14px;
  --radius-sm:7px;--radius-md:9px;
  --sidebar-w:220px;--sidebar-w-collapsed:60px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-base)}
button,input,select,textarea{font:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1600px;margin:auto;padding:var(--sp-4) var(--sp-5);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.logo h1{margin:0;font-size:var(--fs-lg)}.logo small{color:var(--muted);font-size:var(--fs-xs)}
.btn{border:1px solid transparent;background:var(--tonal-bg);color:var(--tonal-ink);border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);font-weight:700;cursor:pointer;transition:background .15s ease,box-shadow .15s ease,transform .1s ease;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:hover{background:#c7dbf5;box-shadow:0 3px 10px rgba(23,39,67,.1)}
.btn.primary:hover{background:var(--brand2);border-color:var(--brand2);box-shadow:0 8px 20px rgba(15,91,215,.35)}
.btn.danger{background:var(--bad-bg);color:var(--bad)} .btn.danger:hover{background:#f5c6c6}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:1600px;margin:auto;padding:var(--sp-5)}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:var(--sp-5)}
.title{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.title h2{font-size:var(--fs-md);margin:0}
.muted{color:var(--muted);font-size:var(--fs-xs)}
.filters{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;margin-bottom:var(--sp-4)}
.filters input,.filters select{border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:#fff;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm)}
.filters input:focus-visible,.filters select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.filters .search{flex:1;min-width:220px;position:relative}
.filters .search input{width:100%;padding-left:32px}
.filters .search .pi{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.filters-actions{margin-left:auto;flex:none}
/* ===== Grid — height cố định + cuộn dọc riêng khi nhiều dòng, cuộn ngang khi
   nhiều cột, cột "Hành động" ghim phải để icon Sửa/Xoá luôn thấy được khi cuộn
   ngang (2026-08-15) — cùng pattern đã có ở danh-muc-dti.html. ===== */
.tablewrap{overflow-x:auto;overflow-y:auto;max-height:420px;border:1px solid var(--border-strong);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:820px;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:var(--sp-3) var(--sp-3);font-size:var(--fs-sm);line-height:1.4;vertical-align:middle}
th{position:sticky;top:0;background:#f8fafc;z-index:3;color:#536076;text-align:left;font-size:var(--fs-xs);font-weight:700;letter-spacing:.01em}
th.sortable{cursor:pointer;user-select:none}
th.sortable .pi{font-size:10px;margin-left:4px;color:var(--muted)}
table th:last-child,table td:last-child{position:sticky;right:0;z-index:1;background:#fff;box-shadow:-2px 0 6px rgba(23,39,67,.08)}
table th:last-child{z-index:4;background:#f8fafc}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:nth-child(even) td:last-child{background:#f8fafc}
tbody tr:hover{background:var(--bg)}
tbody tr:hover td:last-child{background:var(--bg)}
.user-cell{display:flex;align-items:center;gap:var(--sp-3)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-xs);flex:none}
.user-name{font-weight:700}
.user-email{color:var(--muted);font-size:var(--fs-xs)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:750}
.badge.active{background:var(--good-bg);color:var(--good)}
.badge.locked{background:var(--bad-bg);color:var(--bad)}
.role-tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:var(--fs-xs);color:var(--text);background:#f8fafc}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.action-btn{border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .15s ease,color .15s ease}
.action-btn:hover{background:var(--surface-2);color:var(--text)}
.action-btn.danger:hover{background:var(--bad-bg);border-color:#e5a8a8;color:var(--bad)}
.action-btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-top:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text)}
.pagination .pg-info{color:var(--muted)}
.pagination .pg-controls{display:flex;align-items:center;gap:var(--sp-2)}
.pagination select{border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px var(--sp-2);background:#fff;font-size:var(--fs-sm)}
.pagination .pg-btn{border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.pagination .pg-btn:hover:not(:disabled){background:var(--surface-2)}
.pagination .pg-btn:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:980px){.fab{display:block}}
@media(max-width:560px){main{padding:10px}.topin{padding:10px}.filters>*{flex:1}.filters-actions{margin-left:0;width:100%}}
@media print{.topbar,.filters,.no-print,.sidebar{display:none!important}.shell-content{margin-left:0!important}.tablewrap{overflow:visible;max-height:none}table{min-width:0}}

/* ===== Sidebar shell — nguyên xi từ dashboard.html/danh-muc-dti.html, xem
   spec/sidebar-menu/ui-spec.md. Không đổi CSS sidebar khi thêm trang mới —
   chỉ thêm 1 nav item cho đúng trang này (Quản trị hệ thống > Người dùng). ===== */
.shell{position:relative;min-height:100vh;min-height:100dvh}
.shell-content{margin-left:var(--sidebar-w);min-height:100vh;min-height:100dvh;transition:margin-left .2s ease}
.sidebar.collapsed~.shell-content{margin-left:var(--sidebar-w-collapsed)}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;height:100dvh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:35;transition:width .2s ease,transform .25s ease}
.sidebar.collapsed{width:var(--sidebar-w-collapsed)}
.sidebar-brand{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);border-bottom:1px solid var(--line);min-height:50px;flex:none}
.sidebar-brand .brand-mark{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-xs);flex:none}
.sidebar-brand .brand-text{font-weight:800;font-size:var(--fs-md);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-toggle{margin-left:auto;border:1px solid transparent;background:transparent;border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--muted)}
.sidebar-toggle:hover{background:var(--surface-2)}
.sidebar-toggle:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sidebar-toggle svg{transition:transform .2s ease}
.sidebar.collapsed .sidebar-toggle svg{transform:rotate(180deg)}
.sidebar-nav{list-style:none;margin:0;padding:var(--sp-2);overflow-y:auto}
.sidebar-nav li{margin:0}
.sidebar-navitem{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-radius:var(--radius-md);color:var(--text);text-decoration:none;font-size:var(--fs-sm);font-weight:600;position:relative}
.sidebar-navitem .navicon{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sidebar-navitem:hover{background:var(--bg);cursor:pointer}
.sidebar-navitem.active{background:rgba(15,91,215,.08);color:var(--brand);font-weight:700}
.sidebar-navitem.active .navicon{color:var(--brand)}
.sidebar-navitem.active::before{content:'';position:absolute;left:-8px;top:5px;bottom:5px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.sidebar-navitem:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sidebar-navparent{width:100%;background:none;border:0;font:inherit;text-align:left;cursor:pointer}
.sidebar-navparent .navchevron{margin-left:auto;flex:none;display:flex;transition:transform .15s ease;color:var(--muted)}
.sidebar-navgroup:not(.open)>.sidebar-navparent .navchevron{transform:rotate(-90deg)}
.sidebar-submenu{list-style:none;margin:2px 0 4px;padding:0}
.sidebar-navgroup:not(.open) .sidebar-submenu{display:none}
.sidebar-subitem{padding-left:38px;font-size:var(--fs-sm)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sidebar.collapsed .sidebar-navlabel{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sidebar.collapsed .sidebar-navitem{justify-content:center;padding:var(--sp-2)}
.sidebar.collapsed .sidebar-navitem.active::before{left:0}
.sidebar.collapsed .brand-text{display:none}
.sidebar.collapsed .sidebar-brand{justify-content:center;padding:var(--sp-4) var(--sp-1)}
.sidebar.collapsed .sidebar-toggle{margin-left:0}
.sidebar-hamburger{display:none}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(20,28,40,.45);z-index:34}
.sidebar-backdrop.show{display:block}
@media(max-width:980px){
  .shell-content{margin-left:0!important}
  .sidebar{width:min(85vw,300px);transform:translateX(-100%);box-shadow:var(--shadow)}
  .sidebar.collapsed{width:min(85vw,300px)}
  .sidebar.collapsed .sidebar-navlabel{position:static;width:auto;height:auto;padding:0;margin:0;overflow:visible;clip:auto;white-space:normal;border:0}
  .sidebar.collapsed .sidebar-navitem{justify-content:flex-start;padding:var(--sp-2) var(--sp-3)}
  .sidebar.collapsed .brand-text{display:block}
  .sidebar.collapsed .sidebar-brand{justify-content:flex-start;padding:var(--sp-4)}
  .sidebar.drawer-open{transform:translateX(0)}
  .sidebar-hamburger{display:flex;align-items:center;justify-content:center;padding:9px}
}
@media(max-width:560px){
  .sidebar{width:min(90vw,300px)}
  .sidebar-navitem{padding:10px;min-height:40px}
}
@media(min-width:981px){
  .sidebar.collapsed .sidebar-navgroup{position:relative}
  .sidebar.collapsed .sidebar-navparent .navchevron{display:none}
  .sidebar.collapsed .sidebar-submenu{display:none}
  .sidebar.collapsed .sidebar-navgroup:hover .sidebar-submenu,
  .sidebar.collapsed .sidebar-navgroup:focus-within .sidebar-submenu{
    display:block;position:absolute;left:100%;top:0;min-width:180px;margin:0 0 0 6px;padding:6px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40
  }
  .sidebar.collapsed .sidebar-navgroup:hover .sidebar-subitem,
  .sidebar.collapsed .sidebar-navgroup:focus-within .sidebar-subitem{justify-content:flex-start;padding:10px 12px}
  .sidebar.collapsed .sidebar-navgroup:hover .sidebar-submenu .sidebar-navlabel,
  .sidebar.collapsed .sidebar-navgroup:focus-within .sidebar-submenu .sidebar-navlabel{
    position:static;width:auto;height:auto;padding:0;margin:0;overflow:visible;clip:auto;white-space:normal;border:0
  }
}
</style>
</head>
<body>
<div class="shell">
 <aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
   <span class="brand-mark">PM</span>
   <span class="brand-text">PlatformManager</span>

  <nav aria-label="Main">
   <ul class="sidebar-nav">
    <li>

      <span class="navicon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2"/></svg></span>

    <li class="sidebar-navgroup open" data-group="danh-muc">

      <span class="navicon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M2.5 5.5a1 1 0 0 1 1-1h4l1.5 2h7a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1v-9Z"/></svg></span>
      <span class="sidebar-navlabel">Danh mục</span>
      <span class="navchevron" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="6,8 10,12 14,8"/></svg></span>
     </button>
     <ul class="sidebar-submenu" id="submenu-danh-muc">
      <li>
       <a href="danh-muc-dti.html" class="sidebar-navitem sidebar-subitem" data-id="danh-muc-dti" title="DTI" onclick="onSidebarNavItemClick(event)">
        <span class="navicon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="3" y="3" width="14" height="14" rx="2"/><line x1="6" y1="7.5" x2="14" y2="7.5"/><line x1="6" y1="10.5" x2="14" y2="10.5"/><line x1="6" y1="13.5" x2="11" y2="13.5"/></svg></span>
        <span class="sidebar-navlabel">DTI</span>
       </a>
      </li>
     </ul>
    </li>
    <!-- ===== MỚI (corebase) — nhóm "Quản trị hệ thống", theo đúng cơ chế mở rộng
         children đã thiết kế sẵn ở spec/sidebar-menu/ui-spec.md mục 1.2. Icon mới

     </button>
     <ul class="sidebar-submenu" id="submenu-quan-tri">
      <li>
       <a href="quan-tri-nguoi-dung.html" class="sidebar-navitem sidebar-subitem active" data-id="sys-user" title="Người dùng" onclick="onSidebarNavItemClick(event)">
        <span class="navicon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="10" cy="7" r="3"/><path d="M4 17c0-3 2.7-5 6-5s6 2 6 5"/></svg></span>

    </li>
   </ul>
  </nav>
 </aside>
 <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebarDrawer()"></div>
 <div class="shell-content">
<div class="topbar">

<script>
/* Dữ liệu minh hoạ tĩnh — chỉ để xem layout, KHÔNG phải logic thật (không gọi API) */
const users=[

<script>
/* ===== Sidebar shell — nguyên xi logic từ dashboard.html/danh-muc-dti.html ===== */
(function(){
 const SIDEBAR_KEY='platform_manager_sidebar_collapsed_v1';
 const sidebarEl=document.getElementById('sidebar');
 const backdropEl=document.getElementById('sidebarBackdrop');
 const toggleBtn=document.getElementById('sidebarToggle');
 const hamburgerBtn=document.getElementById('sidebarHamburger');
 let lastFocusedBeforeDrawer=null;

 function readCollapsed(){try{return JSON.parse(localStorage.getItem(SIDEBAR_KEY))===true}catch(e){return false}}

 function updateToggleAria(){
  const collapsed=sidebarEl.classList.contains('collapsed');
  toggleBtn.setAttribute('aria-expanded',String(!collapsed));
  toggleBtn.setAttribute('aria-label',collapsed?'Mở rộng menu':'Thu gọn menu');
 }

 window.toggleSidebarCollapse=function(){
  const isCollapsed=sidebarEl.classList.toggle('collapsed');
  try{localStorage.setItem(SIDEBAR_KEY,JSON.stringify(isCollapsed))}catch(e){}
  updateToggleAria();
 };

 function focusableInSidebar(){return Array.from(sidebarEl.querySelectorAll('a,button'))}

 function onSidebarKeydown(e){
  if(e.key==='Escape'){closeSidebarDrawerImpl();return}
  if(e.key==='Tab'){
   const f=focusableInSidebar();if(!f.length)return;
   const first=f[0],last=f[f.length-1];
   if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus()}
   else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus()}
  }
 }

 function openSidebarDrawerImpl(){
  lastFocusedBeforeDrawer=document.activeElement;
  sidebarEl.classList.add('drawer-open');
  backdropEl.classList.add('show');
  hamburgerBtn.setAttribute('aria-expanded','true');
  document.addEventListener('keydown',onSidebarKeydown);
  const first=focusableInSidebar()[0];if(first)first.focus();
 }

 function closeSidebarDrawerImpl(){
  sidebarEl.classList.remove('drawer-open');
  backdropEl.classList.remove('show');
  hamburgerBtn.setAttribute('aria-expanded','false');
  document.removeEventListener('keydown',onSidebarKeydown);
  if(lastFocusedBeforeDrawer && lastFocusedBeforeDrawer.focus)lastFocusedBeforeDrawer.focus();
 }

 window.openSidebarDrawer=openSidebarDrawerImpl;
 window.closeSidebarDrawer=closeSidebarDrawerImpl;

 window.toggleSidebarSubmenu=function(btn){
  const group=btn.closest('.sidebar-navgroup');
  if(!group)return;
  const isOpen=group.classList.toggle('open');
  btn.setAttribute('aria-expanded',String(isOpen));
 };

 window.onSidebarNavItemClick=function(e){
  const link=e.currentTarget;
  if(link.classList && link.classList.contains('active')){e.preventDefault()}
  if(sidebarEl.classList.contains('drawer-open'))closeSidebarDrawerImpl();
 };

 window.addEventListener('resize',function(){
  if(window.innerWidth>=980 && sidebarEl.classList.contains('drawer-open')){
   sidebarEl.classList.remove('drawer-open');backdropEl.classList.remove('show');
  }
 });

 if(readCollapsed())sidebarEl.classList.add('collapsed');
 updateToggleAria();
})();
</script>
