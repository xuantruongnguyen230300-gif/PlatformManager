@if (showShell()) {
  <div class="shell">
    <app-sidebar />
    <div class="shell-content" [class.collapsed]="sidebarState.collapsed()">
      <app-topbar [title]="pageTitle()" />
      <main>
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
<app-toast />
