<app-auth-card title="PlatformManager" subtitle="Đăng nhập để tiếp tục">
  @if (errorMessage()) {
    <div class="login-error show">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form (submit)="$event.preventDefault(); onSubmit()">
    <div class="field">
      <label for="userName">Email</label>
      <div class="field-input">
        <i class="pi pi-envelope"></i>
        <input
          id="userName"
          type="text"
          placeholder="ten@congty.vn"
          autocomplete="username"
          required
          [value]="userName()"
          (input)="onUserNameInput($event)"
        />
      </div>
    </div>

    <div class="field">
      <label for="password">Mật khẩu</label>
      <div class="field-input">
        <i class="pi pi-lock"></i>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Nhập mật khẩu"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="onPasswordInput($event)"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
        >
          <i class="pi" [class.pi-eye]="!showPassword()" [class.pi-eye-slash]="showPassword()"></i>
        </button>
      </div>
    </div>

    <div class="field-row">
      <label><input type="checkbox" /> Ghi nhớ đăng nhập</label>
      <a href="javascript:void(0)">Quên mật khẩu?</a>
    </div>

    <button type="submit" class="btn primary btn-block" [disabled]="submitting()">
      <i class="pi pi-sign-in"></i> {{ submitting() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
    </button>
  </form>
</app-auth-card>
