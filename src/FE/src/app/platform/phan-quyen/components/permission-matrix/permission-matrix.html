<!-- `.tablewrap.scroll`: bảng thuần (không phải p-table) nên vùng cuộn chính là khung này,
     và `th` đã `position: sticky` ở lớp dùng chung nên tiêu đề cột đứng yên khi cuộn. -->
<div class="tablewrap scroll">
  <table>
    <thead>
      <tr>
        <th style="width:40%">{{ 'phan-quyen.grid.screen' | translate }}</th>
        @for (role of roles(); track role) {
          <th class="num">{{ role }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of displayRows(); track row.SysMenuId) {
        <tr>
          <td [class.indent]="row.Indent">
            @if (row.Indent) {
              <span class="tree-branch">└</span>
            }
            {{ row.SysMenuName }}
          </td>
          @for (role of roles(); track role) {
            <td class="num">
              <input
                type="checkbox"
                class="check"
                [checked]="isChecked(row, role)"
                [disabled]="loading()"
                (change)="permissionToggle.emit({ SysMenuId: row.SysMenuId, Role: role })"
                [attr.aria-label]="row.SysMenuName + ' — ' + role"
              />
            </td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="roles().length + 1" class="muted">
            {{ 'phan-quyen.grid.emptyMenu' | translate }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
