<aside class="sidebar" [class.collapsed]="state.collapsed()" [class.drawer-open]="state.mobileOpen()">
  <div class="sidebar-brand">
    <span class="brand-mark">PM</span>
    <span class="brand-text">PlatformManager</span>
    <button
      type="button"
      class="sidebar-toggle no-print"
      [attr.aria-label]="state.collapsed() ? 'Mở rộng menu' : 'Thu gọn menu'"
      [attr.aria-expanded]="!state.collapsed()"
      (click)="state.toggleCollapse()"
    >
      <i class="pi pi-angle-left"></i>
    </button>
  </div>
  <nav aria-label="Main">
    <ul class="sidebar-nav">
      @for (item of items(); track item.Id) {
        <li
          [class.sidebar-navgroup]="item.Children.length > 0"
          [class.open]="item.Children.length > 0 && isGroupOpen(item.Id)"
        >
          @if (item.Children.length > 0) {
            <button
              type="button"
              class="sidebar-navitem sidebar-navparent"
              [class.active]="isGroupActive(item)"
              [attr.aria-expanded]="isGroupOpen(item.Id)"
              [attr.aria-controls]="'submenu-' + item.Id"
              (click)="toggleGroup(item.Id)"
            >
              <span class="navicon" aria-hidden="true"><i class="pi" [class]="iconClass(item.Icon)"></i></span>
              <span class="sidebar-navlabel">{{ item.Label }}</span>
              <span class="navchevron" aria-hidden="true"><i class="pi pi-chevron-down"></i></span>
            </button>
            <ul class="sidebar-submenu" [id]="'submenu-' + item.Id">
              @for (child of item.Children; track child.Id) {
                <li>
                  <a
                    [routerLink]="child.Route"
                    class="sidebar-navitem sidebar-subitem"
                    routerLinkActive="active"
                    [title]="child.Label"
                    (click)="onNavItemClick()"
                  >
                    <span class="navicon" aria-hidden="true"><i class="pi" [class]="iconClass(child.Icon)"></i></span>
                    <span class="sidebar-navlabel">{{ child.Label }}</span>
                  </a>
                </li>
              }
            </ul>
          } @else {
            <a
              [routerLink]="item.Route"
              class="sidebar-navitem"
              routerLinkActive="active"
              [title]="item.Label"
              (click)="onNavItemClick()"
            >
              <span class="navicon" aria-hidden="true"><i class="pi" [class]="iconClass(item.Icon)"></i></span>
              <span class="sidebar-navlabel">{{ item.Label }}</span>
            </a>
          }
        </li>
      }
    </ul>
  </nav>
</aside>
<!-- Backdrop chỉ đóng bằng click chuột hoặc phím Escape (đã xử lý qua host listener
     `(document:keydown.escape)` của Sidebar) — `aria-hidden="true"` đánh dấu đây là phần tử
     decorative dismiss overlay, không phải nội dung điều hướng được, nên không cần làm nó thành
     1 tab-stop bàn phím riêng. -->
<div
  class="sidebar-backdrop no-print"
  [class.show]="state.mobileOpen()"
  aria-hidden="true"
  (click)="state.closeDrawer()"
></div>
