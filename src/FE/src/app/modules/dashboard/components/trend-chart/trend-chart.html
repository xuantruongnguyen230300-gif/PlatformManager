<div class="chart-wrap">
  @if (hasData()) {
    <p-chart
      type="line"
      [data]="chartData()"
      [options]="chartOptions()"
      [ariaLabel]="chartAriaLabel()"
      [style]="{ height: '220px', width: '100%' }"
    />
  } @else {
    <p class="muted">Chưa có đủ dữ liệu để vẽ biểu đồ.</p>
  }
</div>
