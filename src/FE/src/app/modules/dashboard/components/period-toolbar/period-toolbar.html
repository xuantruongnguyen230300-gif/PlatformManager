<section class="weekbar card no-print">
  <strong>Kỳ đang xem:</strong>
  <span class="period-display">{{ periodLabel() || '—' }}</span>

  @if (isAllMode()) {
    <span class="badge bwork">Tất cả · {{ selectedYear() }}</span>
  }

  <select [value]="selectedYear()" title="Chọn năm" (change)="onYearChange($event)">
    @for (y of years(); track y) {
      <option [value]="y">{{ y }}</option>
    }
  </select>

  @if (viewMode() === 'week') {
    <select
      [value]="selectedWeekValue()"
      title="Chọn 1 tuần cụ thể hoặc xem Tất cả"
      (change)="onWeekChange($event)"
    >
      <option value="">— Kỳ hiện tại —</option>
      <option [value]="allWeeksValue">— Tất cả (tổng hợp theo năm) —</option>
      @for (w of weekOptions(); track w.Value) {
        <option [value]="w.Value">{{ weekOptionLabel(w) }}</option>
      }
    </select>
  } @else {
    <select [value]="selectedMonthValue()" title="Chọn tháng" (change)="onMonthChange($event)">
      <option value="">— Tháng hiện tại —</option>
      @for (m of monthOptions(); track m.Value) {
        <option [value]="m.Value">{{ monthOptionLabel(m) }}</option>
      }
    </select>
  }

  <div class="segmented" role="group" aria-label="Chế độ xem theo Tuần hoặc Tháng">
    <button type="button" class="seg-btn" [class.active]="viewMode() === 'week'" (click)="viewModeChange.emit('week')">
      Tuần
    </button>
    <button
      type="button"
      class="seg-btn"
      [class.active]="viewMode() === 'month'"
      (click)="viewModeChange.emit('month')"
    >
      Tháng
    </button>
  </div>

  <div class="weekbar-actions">
    <button type="button" class="btn primary" (click)="exportReport.emit()">Xuất báo cáo</button>
  </div>
</section>
