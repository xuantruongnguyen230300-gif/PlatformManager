<dialog #dialogEl class="form-dialog" (close)="onNativeClose()">
  <div class="title">
    <h2>{{ title() }}</h2>
    <button type="button" class="btn" (click)="dialogEl.close()">Đóng</button>
  </div>

  <div class="form-row">
    <label for="cfCode">Mã <span class="required">*</span></label>
    <input id="cfCode" #codeInput appAutofocus maxlength="20" placeholder="vd 1.1" [value]="editing()?.Code ?? ''" />
  </div>

  <div class="form-row">
    <label for="cfName">Tên chỉ tiêu <span class="required">*</span></label>
    <textarea id="cfName" #nameInput placeholder="Nhập tên đầy đủ chỉ tiêu...">{{ editing()?.Name ?? '' }}</textarea>
  </div>

  <div class="form-grid">
    <div class="form-row">
      <label for="cfGroup">Nhóm <span class="required">*</span></label>
      <select id="cfGroup" #groupSelect [value]="editing()?.GroupId ?? (groups()[0]?.Id ?? '')">
        @for (g of groups(); track g.Id) {
          <option [value]="g.Id">{{ g.Code }}. {{ g.Name }}</option>
        }
      </select>
    </div>
    <div class="form-row">
      <label for="cfMax">Điểm tối đa <span class="required">*</span></label>
      <input id="cfMax" #maxScoreInput type="number" min="0.01" step="0.01" placeholder="vd 10" [value]="editing()?.MaxScore ?? ''" />
    </div>
  </div>

  @if (errorMessage()) {
    <div class="form-error">{{ errorMessage() }}</div>
  }

  <div class="dialog-actions">
    <button type="button" class="btn" (click)="dialogEl.close()">Huỷ</button>
    <button type="button" class="btn primary" (click)="onSubmit(codeInput, nameInput, groupSelect, maxScoreInput)">
      Lưu chỉ tiêu
    </button>
  </div>
</dialog>
