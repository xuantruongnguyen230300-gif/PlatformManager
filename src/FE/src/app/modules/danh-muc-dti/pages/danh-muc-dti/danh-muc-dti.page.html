<div class="card dti-grid-card">
  <div class="title">
    <h2>Danh mục &amp; Đánh giá theo tuần</h2>
    <span class="muted">{{ totalCount() }} bản ghi</span>
  </div>

  @if (!isLive()) {
    <div class="notice">
      Đang xem dữ liệu lịch sử — chỉ đọc. Quay lại "Tất cả (mới nhất trong năm)" của năm hiện tại để chỉnh sửa.
    </div>
  }

  <div class="filters no-print">
    <input placeholder="Tìm mã hoặc tên chỉ tiêu..." [value]="searchInput()" (input)="onSearchInputEvent($event)" />
    <select [value]="selectedGroupId()" (change)="onGroupSelectChange($event)">
      <option value="">Tất cả nhóm</option>
      @for (g of groups(); track g.Id) {
        <option [value]="g.Id">{{ g.Code }}. {{ g.Name }}</option>
      }
    </select>
    <select [value]="selectedYear()" title="Chọn năm" (change)="onYearSelectChange($event)">
      @for (y of periodOptions()?.Years ?? [selectedYear()]; track y) {
        <option [value]="y">{{ y }}</option>
      }
    </select>
    <select
      [value]="selectedPeriod()"
      title="Xem tổng hợp cả năm (mới nhất mỗi chỉ tiêu) hoặc 1 kỳ cụ thể đã lưu trong năm"
      (change)="onPeriodSelectChange($event)"
    >
      <option value="all">Tất cả (mới nhất trong năm)</option>
      @for (w of periodOptions()?.WeeksInYear ?? []; track w.Value) {
        <option [value]="w.Value">{{ w.Value }}</option>
      }
    </select>
    @if (isLive()) {
      <div class="filters-actions">
        <button type="button" class="btn" (click)="openCsvImportDialog()">Import CSV</button>
        <button type="button" class="btn primary" (click)="openCreateForm()">+ Thêm chỉ tiêu</button>
      </div>
    }
  </div>

  <app-criteria-grid-table
    [rows]="rows()"
    [loading]="loading()"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    (editProgress)="onEditProgress($event)"
    (editNote)="onEditNote($event)"
    (editRow)="openEditForm($event)"
    (deleteRow)="onDeleteRow($event)"
    (pageChange)="onGridPageChange($event)"
  />
</div>

<app-criteria-form-dialog
  [open]="formOpen()"
  [editing]="formEditing()"
  [groups]="groups()"
  [serverError]="formServerError()"
  (saved)="onFormSaved($event)"
  (closed)="onFormClosed()"
/>

<app-confirm-dialog
  [open]="confirmOpen()"
  title="Xác nhận"
  [message]="confirmMessage()"
  confirmLabel="Xoá"
  (confirmed)="onConfirmDelete()"
  (closed)="onConfirmClosed()"
/>

@defer (when csvDialogOpen()) {
  <app-csv-import-dialog
    [open]="csvDialogOpen()"
    [importing]="csvImporting()"
    (imported)="onCsvImported($event)"
    (closed)="onCsvDialogClosed()"
  />
}

@defer (when importResultOpen()) {
  <app-import-result-dialog [open]="importResultOpen()" [result]="importResult()" (closed)="onImportResultClosed()" />
}
